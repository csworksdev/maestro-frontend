name: Build and Test Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: .env.production
    timeout-minutes: 20

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false

      - name: Validate frontend environment
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL is empty or unavailable"
            exit 1
          fi
      
          if [[ ! "$VITE_API_URL" =~ ^https?:// ]]; then
            echo "::error::VITE_API_URL must start with http:// or https://"
            exit 1
          fi
      
          echo "VITE_API_URL validation passed"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:run

      - name: Build project
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_WS: ${{ secrets.VITE_API_WS }}
          VITE_WATI_TOKEN: ${{ secrets.VITE_WATI_TOKEN }}
          VITE_WATI_ENDPOINT: ${{ secrets.VITE_WATI_ENDPOINT }}
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_TOKEN_REFRESH_INTERVAL_MINUTES: ${{ secrets.VITE_TOKEN_REFRESH_INTERVAL_MINUTES }}
          VITE_TOKEN_REFRESH_INTERVAL_MS: ${{ secrets.VITE_TOKEN_REFRESH_INTERVAL_MS }}
          VITE_TOKEN_REFRESH_BUFFER_SECONDS: ${{ secrets.VITE_TOKEN_REFRESH_BUFFER_SECONDS }}
          GENERATE_SOURCEMAP: false
        run: pnpm build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          echo "Build successful. Output directory: dist/"
